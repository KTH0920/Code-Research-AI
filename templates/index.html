<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code & Research AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-wrapper">
        <!-- 사이드바 (선택적) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">✨</div>
                    <h2>Code & Research AI</h2>
                </div>
            </div>
            <div class="sidebar-actions">
                <button id="clear-btn" onclick="clearChat()" class="sidebar-btn">
                    <span class="btn-icon">🔄</span>
                    <span>새 대화</span>
                </button>
            </div>
        </aside>

        <!-- 메인 컨테이너 -->
        <div class="main-container">
            <!-- 상단 헤더 (모바일용) -->
            <header class="mobile-header">
                <div class="mobile-header-content">
                    <h1>Code & Research AI</h1>
                    <button id="mobile-clear-btn" onclick="clearChat()" class="mobile-clear-btn">
                        <span>🔄</span>
                    </button>
                </div>
            </header>

            <!-- 채팅 영역 -->
            <main class="chat-main">
                <div id="chat-container">
                    <div id="chat-messages"></div>
                    
                    <!-- 로딩 표시 -->
                    <div id="loading" style="display: none;">
                        <div class="loading-message">
                            <div class="message ai-message">
                                <div class="message-avatar">AI</div>
                                <div class="message-content">
                                    <div class="typing-indicator">
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 모델 표시 -->
                <div id="model-indicator" style="display: none;"></div>
            </main>

            <!-- 입력 영역 -->
            <div class="input-wrapper">
                <div class="input-container">
                    <div class="input-box">
                        <textarea 
                            id="user-input" 
                            placeholder="메시지를 입력하세요..."
                            rows="1"
                        ></textarea>
                        <button id="send-btn" onclick="sendMessage()" class="send-button" aria-label="전송">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                    <div class="input-footer">
                        <span class="input-hint">Shift + Enter로 줄바꿈</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
